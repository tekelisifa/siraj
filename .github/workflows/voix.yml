name: Voix (Chatterbox)

# Génère automatiquement les voix des personnages avec Chatterbox (open source, licence MIT).
# - À chaque changement des dialogues, de la phonétique ou des voix de référence :
#   seules les répliques nouvelles ou modifiées sont générées.
# - Bouton « Run workflow » (onglet Actions) pour régénérer une réplique, un personnage, ou tout.
# - Les voix sont enregistrées dans audio/voix/, puis l'APK est recompilé.
on:
  push:
    branches: [main]
    paths:
      - "scripts/scenes/**"
      - "data/phonetique.json"
      - "tools/**"
      - "audio/voix/reference/**"
      - ".github/workflows/voix.yml"
  workflow_dispatch:
    inputs:
      regenerer:
        description: "À régénérer : « tout », un personnage (ex. Le conteur), ou des identifiants de audio/voix/SCRIPT.md séparés par des virgules. Vide = seulement ce qui manque."
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: voix
  cancel-in-progress: false

jobs:
  voix:
    name: Générer les voix
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ce qu'il y a à générer
        id: plan
        run: |
          cd tools
          python3 generer_voix.py --essai --regenerer "${{ github.event.inputs.regenerer }}" | tee plan.txt
          if head -1 plan.txt | grep -q "^0 réplique(s) à générer, 0 voix"; then
            echo "rien=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Garder le modèle en cache
        if: steps.plan.outputs.rien != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-mtl-${{ runner.os }}-v1

      - name: Installer Chatterbox
        if: steps.plan.outputs.rien != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q --upgrade pip
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git" || pip install -q chatterbox-tts
          python -c "import chatterbox, torch; print('Chatterbox prêt, torch', torch.__version__)"

      - name: Générer les voix
        if: steps.plan.outputs.rien != 'true'
        run: |
          cd tools
          python3 generer_voix.py --regenerer "${{ github.event.inputs.regenerer }}"
          python3 script_voix.py

      - name: Enregistrer dans le dépôt
        id: save
        run: |
          cd tools && python3 script_voix.py && cd ..
          git config user.name "Sirâj — voix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/voix
          if git diff --cached --quiet; then
            echo "Aucune voix nouvelle."
            exit 0
          fi
          git commit -q -m "Voix générées par Chatterbox"
          git pull -q --rebase origin main
          git push -q
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Recompiler l'APK avec les nouvelles voix
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --ref main
