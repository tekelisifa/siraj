name: Essai accent arabe

# Essai ponctuel : produit des extraits « avant / après » dans la branche essai-accent.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Garder le modèle en cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-mtl-${{ runner.os }}-v1

      - name: Installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q --upgrade pip
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git" || pip install -q chatterbox-tts
          pip install -q edge-tts

      - name: Générer les extraits
        run: python3 tools/essai_accent.py

      - name: Publier dans la branche essai-accent
        run: |
          git config user.name "Sirâj — essai"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r essai /tmp/essai
          git checkout --orphan essai-accent
          git rm -rq --cached .
          rm -rf ./*
          cp -r /tmp/essai ./essai
          git add essai
          git commit -q -m "Essai accent arabe : extraits avant / après"
          git push -f -q origin essai-accent
